<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">redMage command menu</title><desc id="desc">A blue and silver tactical menu listing Scan, Analyze, Protect, Chain, Weave and Dispel.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091526"/><stop offset=".55" stop-color="#102d48"/><stop offset="1" stop-color="#080f20"/></linearGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#204d70" stop-opacity=".94"/><stop offset="1" stop-color="#08182d" stop-opacity=".97"/></linearGradient>
<linearGradient id="active"><stop stop-color="#087dbe"/><stop offset=".55" stop-color="#13618d"/><stop offset="1" stop-color="#18364f"/></linearGradient>
</defs>
<rect width="1200" height="820" rx="16" fill="url(#bg)"/>
<g fill="none" stroke="#74ddeb" opacity=".1"><path d="M700 0L280 820M880 0L460 820M1060 0L640 820M1240 0L820 820"/><circle cx="1070" cy="110" r="290"/><circle cx="1070" cy="110" r="235"/></g>
<text x="66" y="69" fill="#92e6e5" font-family="Arial,sans-serif" font-size="21" letter-spacing="5">TACTICAL MODE</text>
<text x="64" y="140" fill="#f5fafb" font-family="Arial,sans-serif" font-size="66" font-weight="300">red<tspan fill="#ff7d91">Mage</tspan></text>
<text x="68" y="178" fill="#adbfce" font-family="Arial,sans-serif" font-size="19" letter-spacing="2">ONE SPELLBOOK. SIX ABILITIES. IDEA TO IMPLEMENTATION.</text>
<rect x="62" y="214" width="1076" height="534" rx="5" fill="url(#panel)" stroke="#adbdc9" stroke-width="2"/>
<path d="M63 265H1137" stroke="#849bad"/>
<text x="86" y="247" fill="#e7f6fa" font-family="Arial,sans-serif" font-size="20">COMMAND / ABILITIES</text>
<text x="1108" y="247" text-anchor="end" fill="#91e7ec" font-family="monospace" font-size="19">/rdm</text>
<rect x="73" y="276" width="1054" height="66" fill="url(#active)" stroke="#54daf8"/><path d="M44 298L59 309L44 320Z" fill="#d7fcff"/><text x="91" y="316" fill="#86c9df" font-family="monospace" font-size="18">01</text><text x="145" y="304" fill="#f3f8fc" font-family="Arial,sans-serif" font-size="23" letter-spacing="2">SCAN</text><text x="145" y="328" fill="#b5cedb" font-family="Arial,sans-serif" font-size="16">Reveal the unknown.</text><text x="1097" y="314" text-anchor="end" fill="#aedce7" font-family="Arial,sans-serif" font-size="18">Requirements &amp; discovery</text><path d="M88 419H1110" stroke="#6d879a" opacity=".25"/><text x="91" y="392" fill="#86c9df" font-family="monospace" font-size="18">02</text><text x="145" y="380" fill="#f3f8fc" font-family="Arial,sans-serif" font-size="23" letter-spacing="2">ANALYZE</text><text x="145" y="404" fill="#b5cedb" font-family="Arial,sans-serif" font-size="16">Give intent a true name.</text><text x="1097" y="390" text-anchor="end" fill="#aedce7" font-family="Arial,sans-serif" font-size="18">Specification</text><path d="M88 495H1110" stroke="#6d879a" opacity=".25"/><text x="91" y="468" fill="#86c9df" font-family="monospace" font-size="18">03</text><text x="145" y="456" fill="#f3f8fc" font-family="Arial,sans-serif" font-size="23" letter-spacing="2">PROTECT</text><text x="145" y="480" fill="#b5cedb" font-family="Arial,sans-serif" font-size="16">Ward against fragile design.</text><text x="1097" y="466" text-anchor="end" fill="#aedce7" font-family="Arial,sans-serif" font-size="18">Architecture &amp; patterns</text><path d="M88 571H1110" stroke="#6d879a" opacity=".25"/><text x="91" y="544" fill="#86c9df" font-family="monospace" font-size="18">04</text><text x="145" y="532" fill="#f3f8fc" font-family="Arial,sans-serif" font-size="23" letter-spacing="2">CHAIN</text><text x="145" y="556" fill="#b5cedb" font-family="Arial,sans-serif" font-size="16">Link each spell to the next.</text><text x="1097" y="542" text-anchor="end" fill="#aedce7" font-family="Arial,sans-serif" font-size="18">Vertical-slice planning</text><path d="M88 647H1110" stroke="#6d879a" opacity=".25"/><text x="91" y="620" fill="#86c9df" font-family="monospace" font-size="18">05</text><text x="145" y="608" fill="#f3f8fc" font-family="Arial,sans-serif" font-size="23" letter-spacing="2">WEAVE</text><text x="145" y="632" fill="#b5cedb" font-family="Arial,sans-serif" font-size="16">Cast through a coordinated party.</text><text x="1097" y="618" text-anchor="end" fill="#aedce7" font-family="Arial,sans-serif" font-size="18">Subagents &amp; implementation</text><path d="M88 723H1110" stroke="#6d879a" opacity=".25"/><text x="91" y="696" fill="#86c9df" font-family="monospace" font-size="18">06</text><text x="145" y="684" fill="#f3f8fc" font-family="Arial,sans-serif" font-size="23" letter-spacing="2">DISPEL</text><text x="145" y="708" fill="#b5cedb" font-family="Arial,sans-serif" font-size="16">Strip away needless enchantments.</text><text x="1097" y="694" text-anchor="end" fill="#aedce7" font-family="Arial,sans-serif" font-size="18">Four-lens review</text><text x="65" y="788" fill="#abc5d4" font-family="Arial,sans-serif" font-size="17">Balance creation with protection. Leave the code lighter than you found it.</text>
<text x="1135" y="788" text-anchor="end" fill="#78e1e5" font-family="monospace" font-size="17">READY</text></svg>